<body>
<header><img src="contact-brand-logo.svg" alt="Contact"><span>CONSULTA DE COBERTURA</span></header>
<main><span class="eyebrow">ÁREAS DE ATENDIMENTO</span><h1>Cobertura</h1><p class="intro">Encontre as operadoras pelo CEP ou nome da cidade.</p>
<form id="coverageSearch"><label class="search-box"><span class="sr-only">Buscar CEP, cidade ou área</span><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="areaSearch" type="search" placeholder="Digite o CEP ou a cidade..." autocomplete="off"><button type="submit">Buscar</button></label></form>
<p class="search-message" id="searchMessage" role="status" aria-live="polite">Digite um CEP ou uma cidade para começar.</p>
<section id="cepConsult" class="results-panel" aria-label="Operadoras encontradas" hidden><div class="results-heading"><div><h2>Operadoras encontradas</h2><p id="resultAddress"></p></div><span id="resultCount"></span></div><div id="providerGrid" class="provider-grid" aria-live="polite"></div><p id="resultNote" class="result-note" role="status"></p></section>
<div id="searchResults"></div>
<details class="map-section" id="mapSection" hidden><summary>Ver mapa e ajustar ponto</summary><div class="map-head"><div><small id="selectedOperator"></small><h2 id="selectedArea"></h2></div><button id="fitMap" type="button">Centralizar</button><button id="closeMap" type="button">Recolher</button></div><div id="coverageMap" aria-label="Mapa da área selecionada"></div><p id="mapStatus" role="status"></p></details>
</main>
