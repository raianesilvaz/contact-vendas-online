<style>
:root{color-scheme:light;--ink:#17202b;--muted:#718096;--teal:#008b8b;--teal-dark:#006e73;--teal-soft:#e0f8f5;--line:#e3e8ee;--white:#fff;--radius:12px;font-family:"DM Sans",Arial,sans-serif;color:var(--ink);background:transparent;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.55}button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid #0b9189;outline-offset:3px}button,input,textarea{color:inherit}button{border:0}svg{width:18px;height:18px;flex:none;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}[hidden]{display:none!important}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.workspace{min-width:0;display:flex;flex-direction:column;height:100dvh;min-height:0}.head-actions,.row-actions{display:flex;gap:8px;align-items:center}.head-actions{justify-content:flex-end;padding:0 0 12px}.eyebrow{text-transform:uppercase;letter-spacing:.14em;color:var(--teal-dark);font-size:10px;font-weight:800;margin:0 0 5px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:9px;min-height:36px;padding:7px 11px;background:white;border:1px solid var(--line);font-size:12px;font-weight:700;white-space:nowrap}.btn svg{width:15px;height:15px}.btn:hover{background:#f2f8f8}.btn.primary{background:var(--teal);color:white;border-color:var(--teal)}.btn.primary:hover{background:var(--teal-dark)}.btn.icon{padding:7px;min-width:34px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#c38320;flex:none}.dot.ready{background:#149a73}.board{display:grid;grid-template-columns:clamp(205px,24%,285px) minmax(0,1fr);flex:1;min-height:0;margin:0;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:#fff;box-shadow:0 7px 24px #223e4a0a}.inbox,.conversation,.details{min-width:0;min-height:0}.inbox{border-right:1px solid var(--line);display:flex;flex-direction:column}.inbox-head{padding:17px 14px 11px}.inbox-head h2,.detail-title{margin:0;font-size:14px;letter-spacing:-.015em}.search{margin:11px 0 10px;display:flex;align-items:center;gap:8px;padding:8px 9px;border:1px solid var(--line);border-radius:9px;background:#f5f8f9;color:var(--muted)}.search svg{width:15px;height:15px}.search input{min-width:0;width:100%;border:0;background:transparent;font-size:12px;outline:none}.list{overflow:auto;flex:1}.thread{width:100%;display:grid;grid-template-columns:35px minmax(0,1fr) auto;align-items:center;gap:9px;min-height:69px;text-align:left;background:white;border-left:3px solid transparent;padding:9px 10px;border-bottom:1px solid #edf2f3}.thread:hover{background:#f5faf9}.thread[aria-pressed=true]{border-left-color:var(--teal);background:#eaf7f4}.avatar{display:grid;place-items:center;border-radius:50%;width:35px;height:35px;font-size:11px;font-weight:850;background:#d9efeb;color:#126961;flex:none}.avatar.rose{background:#f2e3eb;color:#854665}.avatar.violet{background:#ebe6fa;color:#6349a5}.avatar.amber{background:#f8ecd6;color:#876224}.avatar.blue{background:#e1edf7;color:#3a6686}.thread strong,.thread p{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;margin:0}.thread strong{font-size:12px}.thread p{color:var(--muted);font-size:11px;margin-top:5px}.thread-time{align-self:start;display:grid;gap:6px;justify-items:end;margin-top:3px;color:var(--muted);font-size:9px}.unread{border-radius:999px;padding:2px 5px;background:var(--teal);color:white;font-size:9px;font-weight:800}.inbox-foot{margin-top:auto;border-top:1px solid var(--line);padding:11px 13px;color:var(--muted);font-size:10px;display:flex;align-items:center;gap:6px}.inbox-foot svg{width:13px;height:13px}.conversation{display:flex;flex-direction:column;background:#f0f6f4}.chat-top{flex-shrink:0;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;padding:10px 14px;min-height:65px}.chat-top .avatar{width:37px;height:37px}.chat-id{min-width:0;flex:1}.chat-id h2{font-size:14px;margin:0 0 3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.messages{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:11px;padding:17px 17px 15px;background-image:radial-gradient(#b8ceca75 .6px,transparent .6px);background-size:15px 15px}.day{align-self:center;font-weight:720;font-size:10px;color:#5e746f;background:#e2eeea;border-radius:999px;padding:5px 10px;margin:0 0 4px}.bubble{max-width:85%;border:1px solid #d9e7e2;align-self:flex-start;background:white;border-radius:4px 12px 12px 12px;box-shadow:0 2px 3px #203a3005;padding:8px 10px 6px;min-width:88px}.bubble.out{align-self:flex-end;background:#daf2e8;border-color:#cde9de;border-radius:12px 4px 12px 12px}.bubble p{margin:0;line-height:1.48;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}.bubble small{display:flex;justify-content:flex-end;align-items:center;gap:5px;color:#607870;font-size:9px;margin-top:4px}.bubble small svg{width:12px;height:12px;color:var(--teal)}.composer{background:white;border-top:1px solid var(--line);padding:10px 12px}.compose-line{display:flex;gap:7px;align-items:flex-end}.composer textarea{width:100%;min-height:38px;max-height:100px;padding:9px;border:1px solid var(--line);background:#f6f9f9;border-radius:9px;resize:vertical;font-size:12px}.compose-line .btn{min-height:38px}.compose-note{color:var(--muted);font-size:10px;margin:7px 0 0}.reply-group{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}.reply-group button{background:#eaf5f3;color:var(--teal-dark);border-radius:999px;padding:5px 8px;font-size:10px;font-weight:700}.reply-group button:hover{background:#d5ede7}.status-action{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}.empty{margin:auto;text-align:center;padding:28px 15px;color:var(--muted);font-size:12px}.empty strong{display:block;color:var(--ink);font-size:15px;margin-bottom:5px}.mobile-back{display:none}.pop{border:1px solid var(--line);border-radius:15px;padding:18px;width:min(420px,calc(100% - 28px));box-shadow:0 18px 75px #142d3950;color:var(--ink)}.pop::backdrop{background:#122b377a}.pop-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.pop h2{margin:0;font-size:18px}.pop p{color:var(--muted);font-size:12px;line-height:1.5}.pop form{display:grid;gap:10px}.pop label{display:grid;gap:4px;font-size:12px;font-weight:700}.pop input{width:100%;border-radius:8px;padding:9px;border:1px solid var(--line)}.pop .row-actions{justify-content:flex-end}.toast{position:fixed;z-index:4;bottom:18px;left:50%;transform:translateX(-50%);background:#153840;color:white;border-radius:10px;padding:9px 14px;font-size:12px;box-shadow:0 4px 18px #19313930;text-align:center;max-width:calc(100% - 24px)}
/* Contact identity stays in view while the messages scroll. */
.board.with-details{grid-template-columns:clamp(205px,24%,285px) minmax(0,1fr) clamp(196px,22%,260px)}
.contact-phone{display:flex;align-items:center;gap:5px;margin:0;color:var(--teal-dark);font-size:12px;font-weight:650;font-variant-numeric:tabular-nums}
.contact-phone svg{width:13px;height:13px}
.contact-phone.unavailable{color:var(--muted);font-weight:500}
.contact-toggle[aria-expanded="true"]{background:var(--teal-soft);color:var(--teal-dark);border-color:#b9e2dc}
.details{border-left:1px solid var(--line);overflow:auto;background:var(--white)}
.details-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);min-height:65px}
.details .contact{display:grid;justify-items:center;text-align:center;gap:7px;margin:16px 12px 0;padding:16px 8px;border-radius:var(--radius);background:#f4f8f8}
.details .avatar{width:48px;height:48px;font-size:15px}
.contact strong{font-size:14px;overflow-wrap:anywhere;max-width:100%}
.details-channel{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:15px 14px 0;padding:12px 0;border-top:1px solid var(--line);font-size:11px}
.details-channel dt{color:var(--muted)}
.details-channel dd{margin:0;font-weight:700}
@media(max-width:890px){
 .board,.board.with-details{grid-template-columns:minmax(195px,.75fr) minmax(0,1.5fr);position:relative}
 .details{position:absolute;z-index:2;inset:0 0 0 auto;width:min(290px,90%);box-shadow:-6px 0 26px #17384230}
}
@media(max-width:610px){
 .head-actions .btn{font-size:10px;padding:5px 6px;gap:4px}
 .head-actions .btn svg{width:12px;height:12px}
 .board{display:block}
 .inbox,.conversation{height:100%;border-right:0}
 .board:not(.active-thread) .conversation,.board.active-thread .inbox{display:none}
 .mobile-back{display:inline-flex}
 .messages{padding:12px 10px}
 .chat-top{gap:6px;padding-inline:9px}
 .chat-top .btn{padding-inline:6px}
 .chat-id h2,.bubble p{font-size:12px}
}
.inbox-head{padding-bottom:4px}.chat-id{flex:1}.status-action{flex-wrap:wrap}#account-info{font-weight:750;color:var(--ink)}#connection-dialog .row-actions{margin-top:14px}

#whatsapp-qr{display:block;max-width:100%;height:auto;margin:12px auto;border:1px solid var(--line);border-radius:10px}
</style>

<body>
<svg aria-hidden="true" style="display:none" xmlns="http://www.w3.org/2000/svg"><defs>
<symbol id="chat" viewBox="0 0 24 24"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5H4l1.7-3.2A8.5 8.5 0 1 1 21 11.5Z"/><path d="M9 11.5h.01m3.5 0h.01m3.5 0h.01"/></symbol>
<symbol id="search" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></symbol>
<symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="send" viewBox="0 0 24 24"><path d="m21 3-7 18-3.5-7.5L3 10l18-7ZM10.5 13.5 21 3"/></symbol>
<symbol id="person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></symbol>
<symbol id="phone" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2c0 9 7 16 16 16a2 2 0 0 0 2-2v-3l-5-2-2 2a12 12 0 0 1-6-6l2-2-2-5Z"/></symbol>

<symbol id="flask" viewBox="0 0 24 24"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3M8 15h8"/></symbol>
</defs></svg>
<main class="workspace" aria-label="Conversas do WhatsApp">
  <div class="head-actions"><button class="btn" id="connection" type="button"><span class="dot" id="connection-dot"></span><span id="connection-label">Conectar meu WhatsApp</span></button><button class="btn primary" id="new-conversation" type="button"><svg><use href="#plus"/></svg> Nova conversa</button></div>
  <div class="board" id="board">
   <section class="inbox" aria-label="Lista de conversas"><div class="inbox-head"><h2>Conversas</h2><label class="search"><svg><use href="#search"/></svg><span class="sr">Buscar conversa</span><input id="search-input" type="search" placeholder="Buscar nome ou telefone"></label></div><div class="list" id="list"></div><div class="inbox-foot"><svg><use href="#flask"/></svg> WhatsApp individual · Piloto</div></section>
   <section class="conversation" aria-label="Conversa ativa" id="conversation"></section>
   <aside class="details" aria-labelledby="details-title" id="details" hidden></aside>
  </div>
</main>
<dialog class="pop" id="connection-dialog">
 <div class="pop-top"><div><p class="eyebrow">WhatsApp individual</p><h2>Meu WhatsApp</h2></div><button class="btn icon" type="button" data-dismiss aria-label="Fechar"><svg><use href="#close"/></svg></button></div>
 <p id="account-info"></p><p id="connection-description"></p><img id="whatsapp-qr" alt="QR Code para vincular seu WhatsApp" width="260" height="260" hidden>
 <div class="row-actions"><button class="btn" type="button" data-dismiss>Voltar</button><button class="btn primary" type="button" id="toggle-connection">Gerar QR Code</button></div>
</dialog>
<dialog class="pop" id="new-dialog"><div class="pop-top"><div><p class="eyebrow">WhatsApp individual</p><h2>Nova conversa</h2></div><button class="btn icon" type="button" data-dismiss aria-label="Fechar"><svg><use href="#close"/></svg></button></div><p>Informe o telefone do contato com DDD.</p><form id="new-form"><label>Telefone <input name="phone" type="tel" required maxlength="25" placeholder="(11) 90000-0000"></label><p id="new-error" role="status"></p><div class="row-actions"><button class="btn" type="button" data-dismiss>Cancelar</button><button class="btn primary" type="submit">Abrir conversa</button></div></form></dialog>
<div class="toast" id="toast" role="status" hidden></div>
<script>
const $ = id => document.getElementById(id);
const icon = name => `<svg aria-hidden="true"><use href="#${name}"/></svg>`;
const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const states = {disconnected:'Conectar meu WhatsApp',connecting:'Conectando…',qr_ready:'Escanear QR Code',connected:'Meu WhatsApp conectado',disconnecting:'Desconectando…',error:'Conectar meu WhatsApp'};
let connection={status:'disconnected'}, threads=[], selected=null, messages=[], refreshRunning=false, sending=false, changingConnection=false;
let nextRequest=0, chatEpoch=0, toastTimer, confirmingDisconnect=false;
const pending = new Map();
const drafts = new Map();
const compact = matchMedia('(max-width: 890px)');
let detailsOpen = !compact.matches;
function request(action,payload={}) {
 const id=++nextRequest;
 return new Promise((resolve,reject)=>{
  const timer=setTimeout(()=>{pending.delete(id);reject(Error('O conector demorou a responder. Tente novamente.'));},55_000);
  pending.set(id,{resolve,reject,timer});
  parent.postMessage({source:'contact-personal-whatsapp',id,action,payload},'*');
 });
}
window.addEventListener('message',event=>{
 if(event.source!==parent||event.data?.source!=='contact-personal-whatsapp-response')return;
 const {id,value,error}=event.data, call=pending.get(id);
 if(!call)return;
 clearTimeout(call.timer);pending.delete(id);
 if(error)call.reject(Error(error));else call.resolve(value);
});
const connected = () => connection.status==='connected';
const keyFor = person => person?.jid || person?.phone || '';
const phoneFor = person => person?.phone || (person?.jid?.endsWith('@s.whatsapp.net') ? '+'+person.jid.split('@')[0] : '');
function displayPhone(person) {
 const digits=phoneFor(person).replace(/\D/g,'');
 if(!digits)return '';
 return '+'+digits.replace(/^55(\d{2})(\d{4,5})(\d{4})$/,'55 ($1) $2-$3');
}
const nameFor = person => person?.name?.trim() || displayPhone(person) || 'Contato do WhatsApp';
const initials = name => name.split(/\s+/).slice(0,2).map(part=>part[0]).join('').toUpperCase();
const avatar = person => `<span class="avatar" aria-hidden="true">${person?.name?.trim()?escapeHtml(initials(nameFor(person))):icon('person')}</span>`;
const time = at => at ? new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Sao_Paulo',hour:'2-digit',minute:'2-digit'}).format(at) : '';
const day = at => new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Sao_Paulo',dateStyle:'short'}).format(at);
function notify(message) {
 const toast=$('toast');toast.textContent=message;toast.hidden=false;
 clearTimeout(toastTimer);toastTimer=setTimeout(()=>{toast.hidden=true;},4600);
}
function renderConnection() {
 $('connection-dot').classList.toggle('ready',connected());
 $('connection-label').textContent=states[connection.status] || states.disconnected;
 $('new-conversation').disabled=!connected();
 const button=$('toggle-connection');
 $('account-info').textContent=connected()?`WhatsApp conectado${connection.phone?' · +'+connection.phone:''}`:states[connection.status]||states.disconnected;
 $('connection-description').textContent=connection.error||(
  confirmingDisconnect?'O CONTACT limpa a sessão, as conversas carregadas e os rascunhos. O histórico continua no seu WhatsApp.':
  connected()?'O histórico recente e as novas mensagens de texto ficam disponíveis enquanto durar a conexão.':
  connection.status==='qr_ready'?'No celular, abra WhatsApp → Aparelhos conectados → Conectar um aparelho e escaneie o código.':
  connection.status==='connecting'?'Aguarde enquanto o conector prepara sua sessão.':
  'Vincule seu WhatsApp para carregar as conversas recentes disponíveis.'
 );
 const qr=$('whatsapp-qr');
 const image=connection.status==='qr_ready'&&/^data:image\/png;base64,[a-zA-Z0-9+/=]+$/.test(connection.qr||'');
 if(image&&qr.getAttribute('src')!==connection.qr)qr.src=connection.qr;
 if(!image)qr.removeAttribute('src');
 qr.hidden=!image;
 button.textContent=connected()?(confirmingDisconnect?'Confirmar desconexão':'Desconectar meu WhatsApp'):connection.status==='qr_ready'?'Aguardando leitura…':connection.status==='connecting'?'Conectando…':connection.status==='disconnecting'?'Desconectando…':'Gerar QR Code';
 button.disabled=changingConnection||['connecting','qr_ready','disconnecting'].includes(connection.status);
}
function clearChat() {
 chatEpoch++;
 selected=null;messages=[];threads=[];drafts.clear();
 $('search-input').value='';
 $('new-form').reset();$('new-error').textContent='';
 $('new-dialog').close();
 detailsOpen=!compact.matches;
 $('board').classList.remove('active-thread');
}
function renderList() {
 const query=$('search-input').value.trim().toLocaleLowerCase('pt-BR');
 const digits=query.replace(/\D/g,'');
 $('list').innerHTML=threads.filter(person=>!query||nameFor(person).toLocaleLowerCase('pt-BR').includes(query)||(digits&&phoneFor(person).includes(digits))).map(person=>
  `<button class="thread" type="button" data-jid="${escapeHtml(person.jid)}" aria-pressed="${person.jid===selected?.jid}">${avatar(person)}<span><strong>${escapeHtml(nameFor(person))}</strong><p>${escapeHtml(person.body||'Nova conversa')}</p></span><span class="thread-time">${time(person.at)}</span></button>`
 ).join('')||`<div class="empty"><strong>${connected()?'Nenhuma conversa':'WhatsApp desconectado'}</strong>${connected()?'As conversas aparecem conforme o WhatsApp sincroniza.':'Conecte seu número para começar.'}</div>`;
}
function renderMessages() {
 const log=$('messages');if(!log)return;
 const nearBottom=log.scrollHeight-log.scrollTop-log.clientHeight<45;
 let lastDay='';
 const markup=messages.map(message=>{
  const label=message.at?day(message.at):'', header=label!==lastDay&&label?`<span class="day">${label}</span>`:'';
  lastDay=label;
  return `${header}<div class="bubble ${message.direction==='out'?'out':''}"><p>${escapeHtml(message.body)}</p><small>${time(message.at)}${message.direction==='out'?icon('check'):''}</small></div>`;
 }).join('')||'<div class="empty">A conversa começa quando você escrever uma mensagem.</div>';
 if(log.innerHTML!==markup){log.innerHTML=markup;if(nearBottom)log.scrollTop=log.scrollHeight;}
}
function renderDetailsVisibility() {
 const visible=Boolean(selected && connected() && detailsOpen);
 $('details').hidden=!visible;
 $('board').classList.toggle('with-details',visible);
 $('show-info')?.setAttribute('aria-expanded',String(visible));
}
compact.addEventListener('change',event=>{
 detailsOpen=!event.matches;
 renderDetailsVisibility();
});
function closeDetails() {
 detailsOpen=false;
 renderDetailsVisibility();
 $('show-info').focus();
}
function renderIdentity() {
 const name=escapeHtml(nameFor(selected)), phone=displayPhone(selected);
 const phoneMarkup=phone&&name===phone?'':`<p class="contact-phone${phone?'':' unavailable'}">${icon('phone')}${escapeHtml(phone || 'Telefone não disponível')}</p>`;
 $('chat-avatar').innerHTML=avatar(selected);
 $('chat-identity').innerHTML=`<h2>${name}</h2>${phoneMarkup}`;
 $('contact-identity').innerHTML=`${avatar(selected)}<strong>${name}</strong>${phoneMarkup}`;
}
function renderChat() {
 const panel=$('conversation'),details=$('details');
 if(!selected||!connected()){
  panel.innerHTML=`<div class="empty"><strong>${connected()?'Selecione uma conversa':'Conecte seu WhatsApp'}</strong>${connected()?'Escolha uma conversa ou clique em Nova conversa.':'Use o botão acima para vincular seu número.'}</div>`;
  details.replaceChildren();
  renderDetailsVisibility();
  return;
 }
 const person=selected;
 panel.innerHTML=`<header class="chat-top"><button class="btn icon mobile-back" id="back-to-list" aria-label="Voltar às conversas" type="button">${icon('back')}</button><div id="chat-avatar"></div><div class="chat-id" id="chat-identity"></div><button class="btn icon contact-toggle" id="show-info" type="button" aria-label="Dados do contato" aria-controls="details" title="Dados do contato">${icon('person')}</button></header>
 <div class="messages" id="messages" role="log" aria-label="Mensagens"></div>
 <form class="composer" id="composer"><div class="compose-line"><label class="sr" for="draft">Digite uma mensagem</label><textarea id="draft" rows="1" maxlength="2000" placeholder="Digite uma mensagem…"></textarea><button class="btn primary" id="send" type="submit">${icon('send')} Enviar</button></div><p class="compose-note">Enter envia · Shift + Enter quebra a linha</p></form>`;
 details.innerHTML=`<header class="details-head"><h2 class="detail-title" id="details-title">Dados do contato</h2><button class="btn icon" id="close-info" type="button" aria-label="Fechar dados do contato">${icon('close')}</button></header>
 <div class="contact" id="contact-identity"></div>
 <dl class="details-channel"><dt>Canal</dt><dd>WhatsApp</dd></dl>`;
 renderIdentity();
 $('back-to-list').onclick=()=>{
  $('board').classList.remove('active-thread');
  detailsOpen=false;
  renderDetailsVisibility();
  $('list').querySelector('[aria-pressed="true"]')?.focus();
 };
 $('show-info').onclick=()=>{
  detailsOpen=!detailsOpen;
  renderDetailsVisibility();
  if(detailsOpen&&compact.matches)$('close-info').focus();
 };
 $('close-info').onclick=closeDetails;
 details.onkeydown=event=>{if(event.key==='Escape')closeDetails();};
 renderDetailsVisibility();
 const draft=$('draft'),form=$('composer'),send=$('send');
 draft.value=drafts.get(keyFor(person))||'';send.disabled=sending||!draft.value.trim();
 draft.oninput=()=>{drafts.set(keyFor(person),draft.value);send.disabled=sending||!draft.value.trim();};
 draft.onkeydown=event=>{if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();form.requestSubmit();}};
 form.onsubmit=async event=>{
  event.preventDefault();const body=draft.value.trim();if(!body||sending||!connected())return;
  sending=true;send.disabled=true;const epoch=chatEpoch;
  try {
   const sent=await request('send',{message:body,jid:person.jid,phone:person.phone});
   if(epoch!==chatEpoch)return;
   drafts.delete(keyFor(person));
   if(selected===person){selected={...person,jid:sent.jid};messages.push(sent);}
   threads=[{...person,jid:sent.jid,body:sent.body,at:sent.at},...threads.filter(item=>item.jid!==sent.jid)];
   renderList();renderChat();
  }catch(error){if(epoch===chatEpoch)notify(error.message);}
  finally{sending=false;if($('send'))$('send').disabled=!$('draft').value.trim();}
 };
 renderMessages();$('messages').scrollTop=$('messages').scrollHeight;
}
async function refresh() {
 if(refreshRunning||changingConnection)return;
 refreshRunning=true;
 const requested=selected?.jid,wasConnected=connected(),epoch=chatEpoch;
 try{
  const data=await request('status',{jid:requested});
  if(changingConnection||epoch!==chatEpoch)return;
  connection=data;threads=data.conversations||[];
  if(!connected()&&wasConnected)clearChat();
  else if(requested&&requested===selected?.jid)messages=data.messages||[];
  const contact=selected?.jid&&threads.find(person=>person.jid===selected.jid);
  if(contact&&(contact.name!==selected.name||contact.phone!==selected.phone)){
   Object.assign(selected,{name:contact.name,phone:contact.phone});
   if($('chat-identity'))renderIdentity();
  }
  renderConnection();renderList();
  if(wasConnected!==connected())renderChat();else renderMessages();
 }catch(error){if(epoch===chatEpoch){connection.error=error.message;renderConnection();}}
 finally{refreshRunning=false;}
}
function openConnection(){confirmingDisconnect=false;renderConnection();$('connection-dialog').showModal();}
$('connection').onclick=openConnection;
$('toggle-connection').onclick=async()=>{
 if(changingConnection)return;
 if(connected()&&!confirmingDisconnect){confirmingDisconnect=true;renderConnection();return;}
 const action=connected()?'disconnect':'connect';
 changingConnection=true;
 if(action==='disconnect'){
  connection={status:'disconnecting'};clearChat();renderList();renderChat();
 }
 renderConnection();
 try {
  connection=await request(action);confirmingDisconnect=false;
  if(action==='disconnect')$('connection-dialog').close();
  renderList();renderChat();
 }catch(error){connection={status:'error',error:error.message};notify(error.message);}
 finally{changingConnection=false;renderConnection();refresh();}
};
$('new-conversation').onclick=()=>{if(connected()){$('new-error').textContent='';$('new-dialog').showModal();}};
$('new-form').onsubmit=event=>{
 event.preventDefault();if(!connected())return;
 let phone=new FormData(event.target).get('phone').replace(/\D/g,'');
 if([10,11].includes(phone.length))phone='55'+phone;
 if(!/^55\d{10,11}$/.test(phone)){$('new-error').textContent='Informe um telefone brasileiro com DDD.';return;}
 const existing=threads.find(person=>phoneFor(person).replace(/\D/g,'')===phone);
 selected=existing||{phone:'+'+phone};messages=[];
 if(compact.matches)detailsOpen=false;
 $('board').classList.add('active-thread');
 event.target.reset();$('new-dialog').close();renderList();renderChat();refresh();
};
$('search-input').oninput=renderList;
$('list').onclick=event=>{
 const item=event.target.closest('[data-jid]');if(!item)return;
 selected=threads.find(person=>person.jid===item.dataset.jid)||null;messages=[];
 if(compact.matches)detailsOpen=false;
 $('board').classList.add('active-thread');renderList();renderChat();refresh();
};
document.querySelectorAll('[data-dismiss]').forEach(button=>button.onclick=()=>button.closest('dialog').close());
renderConnection();renderList();renderChat();refresh();
setInterval(()=>{if(!document.hidden)refresh();},5000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh();});
</script>
</body>
</html>
